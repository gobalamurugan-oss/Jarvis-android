
name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'JARVIS_Android_Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract JARVIS project
        run: unzip -o JARVIS_Android_Project.zip -d source

      - name: Build APK
        run: gradle -p source/JarvisAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-APK
          path: source/JarvisAndroid/app/build/outputs/apk/debug/app-debug.apk
